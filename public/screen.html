<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>SlideLink</title><link rel="stylesheet" href="/presentation.css"><script defer src="/slidelink.js"></script><script type="module" src="/presentation.js"></script></head>
<body><div id="app"><header id="header"><a href="/" target="_blank" rel="noopener">S↗</a><strong id="deck-title">SlideLink</strong><span id="connection">正在加载…</span></header><main id="panes" class="panes"><section id="stage" class="stage"><div id="viewport" class="viewport"><div id="slide-box" class="slide-box"><iframe id="slide-frame" title="Slide" sandbox="" referrerpolicy="no-referrer"></iframe></div></div></section><div id="gutter" class="gutter" role="separator" tabindex="0" aria-label="调整 slides 与讲稿区域比例"></div><aside class="notes-pane" id="notes-pane"><div class="notes-heading"><span id="note-page"></span><strong>私密讲稿 · 不投屏</strong></div><div id="notes-scroll" class="notes-scroll"><div id="notes-content" class="notes-content"><pre id="notes-text"></pre><textarea id="notes-editor" aria-label="编辑当前页讲稿" hidden></textarea><svg class="notes-ink" id="notes-ink" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg></div></div><div class="notes-save"><span id="notes-status"></span><div id="saved-links" hidden></div></div><div class="notes-controls"><button id="edit-notes">编辑讲稿</button><button id="save-notes">保存新版本</button><button id="font-minus" aria-label="缩小讲稿字号">A−</button><button id="font-plus" aria-label="放大讲稿字号">A＋</button><button id="private-pen">私人批注</button><button id="private-undo">撤销</button></div></aside></main><footer id="footer"><button id="previous" aria-label="上一页">←</button><span id="counter"></span><button id="next" aria-label="下一页">→</button><select id="jump" aria-label="跳转页码"></select><span id="clock">00:00</span><button id="timer">计时</button><button id="fullscreen" aria-label="全屏">⛶</button></footer></div><button id="screen-hint" class="screen-hint" hidden>点此全屏，或按 F · 此屏只显示 slides 和公开批注</button><div id="fatal">正在加载演示…</div></body></html>
