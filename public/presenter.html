<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>SlideLink</title><link rel="stylesheet" href="/presentation.css"><script defer src="/slidelink.js"></script><script type="module" src="/presentation.js"></script></head>
<body><div id="app"><header id="header"><a href="/" target="_blank" rel="noopener" data-i18n="Library">Library</a><strong id="deck-title">SlideLink</strong><span id="connection" data-i18n="Loading…">Loading…</span><select data-language aria-label="Language" data-i18n-aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select></header><main id="panes" class="panes"><section id="stage" class="stage"><div id="viewport" class="viewport"><div id="slide-box" class="slide-box"><iframe id="slide-frame" title="Slide" sandbox="" referrerpolicy="no-referrer"></iframe></div></div></section><div id="gutter" class="gutter" role="separator" tabindex="0" aria-label="Resize slides and notes" data-i18n-aria-label="Resize slides and notes"></div><aside class="notes-pane" id="notes-pane"><div class="notes-heading"><span id="note-page"></span><span class="notes-tool" id="notes-tool" title="Use the same pen here. Pencil marks; fingers scroll."><i id="note-tool-color"></i><span id="note-tool-label"></span></span><strong data-i18n="Notes · Not shared">Notes · Not shared</strong></div><div id="notes-scroll" class="notes-scroll"><div id="notes-content" class="notes-content"><pre id="notes-text"></pre><textarea id="notes-editor" aria-label="Edit current slide notes" data-i18n-aria-label="Edit current slide notes" hidden></textarea><svg class="notes-ink" id="notes-ink" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg></div></div><div class="notes-save"><span id="notes-status"></span><div id="saved-links" hidden></div></div><div class="notes-controls"><button id="edit-notes" data-i18n="Edit notes">Edit notes</button><button id="save-notes" data-i18n="Save new version">Save new version</button><button id="font-minus" aria-label="Smaller notes text" data-i18n-aria-label="Smaller notes text">A−</button><button id="font-plus" aria-label="Larger notes text" data-i18n-aria-label="Larger notes text">A＋</button><div class="notes-history"><button id="private-undo" disabled aria-label="Undo note mark" data-i18n-aria-label="Undo note mark" title="Undo note mark" data-i18n-title="Undo note mark">↶</button><button id="private-redo" disabled aria-label="Redo note mark" data-i18n-aria-label="Redo note mark" title="Redo note mark" data-i18n-title="Redo note mark">↷</button><button id="private-clear" disabled aria-label="Clear note marks" data-i18n-aria-label="Clear note marks" title="Clear note marks" data-i18n-title="Clear note marks">×</button></div></div></aside></main><footer id="footer"><button id="previous" aria-label="Previous slide" data-i18n-aria-label="Previous slide">←</button><span id="counter"></span><button id="next" aria-label="Next slide" data-i18n-aria-label="Next slide">→</button><select id="jump" aria-label="Go to slide" data-i18n-aria-label="Go to slide"></select><span id="clock">00:00</span><button id="timer" data-i18n="Start timer">Start timer</button><button id="fullscreen" aria-label="Fullscreen" data-i18n-aria-label="Fullscreen">⛶</button></footer></div><button id="screen-hint" class="screen-hint" hidden data-i18n="Fullscreen · F">Fullscreen · F</button><div id="fatal" data-i18n="Loading presentation…">Loading presentation…</div></body></html>
