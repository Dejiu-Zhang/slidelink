<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlideLink</title><link rel="stylesheet" href="/style.css"><script type="module" src="/library.js"></script></head>
<body class="library">
<aside class="sidebar">
  <a class="brand" href="/">SlideLink</a>
  <button class="nav-item selected" id="all-projects"><span data-i18n="All projects">All projects</span> <span id="total-count" class="count">0</span></button>
  <div class="folder-heading"><span data-i18n="Folders">Folders</span><button id="new-folder" title="New folder" data-i18n-title="New folder" aria-label="New folder" data-i18n-aria-label="New folder">+</button></div>
  <nav id="folders" aria-label="Folders" data-i18n-aria-label="Folders"></nav>
  <div class="sidebar-bottom"><button id="workspace-settings" class="nav-item" data-i18n="Settings">Settings</button></div>
</aside>
<main class="workspace">
  <header class="topbar"><span id="breadcrumb"></span><div class="topbar-actions"><select data-language aria-label="Language" data-i18n-aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select><button class="primary" id="new-project" data-i18n="New project">New project</button></div></header>
  <section id="library-view">
    <div class="list-heading"><input id="search" type="search" placeholder="Search projects" data-i18n-placeholder="Search projects" aria-label="Search projects" data-i18n-aria-label="Search projects"><div id="folder-actions" hidden><button class="text-button" id="rename-folder" data-i18n="Rename folder">Rename folder</button><button class="text-button" id="delete-folder" data-i18n="Remove">Remove</button></div></div>
    <div id="projects" class="project-list"></div>
    <div id="empty" class="empty"><p id="empty-text"></p><button id="demo" class="text-button" data-i18n="Use sample files">Use sample files</button></div>
  </section>
  <section id="project-view" hidden>
    <button id="back" class="text-button back">← <span data-i18n="Back">Back</span></button>
    <div class="page-heading"><div><h1 id="project-name"></h1><p id="project-meta"></p></div><button id="new-version" class="primary" data-i18n="Upload version">Upload version</button></div>
    <div class="project-tools"><button id="rename-project" class="text-button" data-i18n="Rename">Rename</button><label><span data-i18n="Folder">Folder</span> <select id="move-folder" aria-label="Folder" data-i18n-aria-label="Folder"></select></label></div>
    <h2 class="section-title" data-i18n="Versions">Versions</h2><div id="versions"></div>
  </section>
  <p id="toast" class="toast" role="status" hidden></p>
</main>
<dialog id="upload-dialog">
<form id="upload-form">
  <header class="dialog-heading"><h2 id="upload-title"></h2><button type="button" class="icon-button" data-close="upload-dialog" aria-label="Close" data-i18n-aria-label="Close">×</button></header>
  <div class="upload-fields"><label><span data-i18n="Project name">Project name</span><input name="title" id="title" required maxlength="150"></label><label><span data-i18n="Version label">Version label</span><input name="versionLabel" id="version-label" maxlength="100" placeholder="Optional" data-i18n-placeholder="Optional"></label></div>
  <div class="upload-fields file-fields"><label>Slides <span class="field-hint" data-i18n="HTML, up to 6 MB">HTML, up to 6 MB</span><input type="file" id="html-file" accept=".html,.htm" required></label><label><span data-i18n="Notes">Notes</span> <span class="field-hint" data-i18n="TXT / Markdown, optional">TXT / Markdown, optional</span><input type="file" id="notes-file" accept=".txt,.md,.markdown"></label></div>
  <label><span data-i18n="Notes content">Notes content</span><textarea id="notes-text" rows="4" placeholder="First slide notes&#10;---&#10;Second slide notes" data-i18n-placeholder="First slide notes&#10;---&#10;Second slide notes"></textarea></label>
  <details class="import-options"><summary data-i18n="Format and slide size">Format and slide size</summary><p data-i18n="Separate slide notes with --- on its own line, or use # Slide 1 headings. Leave blank to use speaker notes embedded in the HTML."></p><p data-i18n="Static HTML, inline CSS, SVG, images and rendered formulas are supported. JavaScript, interactive animations and embedded players do not run."></p><div class="dimensions"><label><span data-i18n="Width">Width</span><input type="number" id="canvas-width" value="1200" min="200" max="4000"></label><label><span data-i18n="Height">Height</span><input type="number" id="canvas-height" value="675" min="200" max="4000"></label></div></details>
  <div id="preview" hidden><div class="preview-heading"><span id="preview-count"></span><span><button type="button" id="preview-prev" class="secondary" aria-label="Previous preview" data-i18n-aria-label="Previous preview">←</button> <span id="preview-index"></span> <button type="button" id="preview-next" class="secondary" aria-label="Next preview" data-i18n-aria-label="Next preview">→</button></span></div><div class="preview-panels"><div id="preview-stage" class="preview-stage"><div id="preview-box" class="slide-box"><iframe id="preview-frame" title="Slide preview" data-i18n-title="Slide preview" sandbox="" referrerpolicy="no-referrer"></iframe></div></div><textarea id="preview-notes" aria-label="Edit slide notes" data-i18n-aria-label="Edit slide notes" placeholder="Notes for this slide" data-i18n-placeholder="Notes for this slide"></textarea></div><ul id="warnings"></ul></div>
  <p id="upload-error" class="error" role="alert"></p><footer class="dialog-actions"><button id="preview-button" type="button" class="secondary" data-i18n="Preview">Preview</button><button id="save-button" class="primary" disabled data-i18n="Save version">Save version</button></footer>
</form>
</dialog>
<dialog id="settings-dialog"><header class="dialog-heading"><h2 data-i18n="Settings">Settings</h2><button class="icon-button" data-close="settings-dialog" aria-label="Close" data-i18n-aria-label="Close">×</button></header><label><span data-i18n="Workspace key">Workspace key</span><input id="workspace-key" type="password" autocomplete="off"></label><p class="muted" data-i18n="Use this key on another device to open the same library. Keep a backup."></p><div class="button-row"><button id="copy-workspace" class="secondary" data-i18n="Copy key">Copy key</button><button id="open-workspace" class="secondary" data-i18n="Open">Open</button><button id="create-workspace" class="text-button" data-i18n="New workspace">New workspace</button></div><label id="upload-key-label" hidden><span data-i18n="Upload passcode">Upload passcode</span><input id="upload-key" type="password" autocomplete="off" placeholder="Provided by the site owner" data-i18n-placeholder="Provided by the site owner"></label><p class="muted" id="retention"></p><p id="settings-message" role="status"></p></dialog>
<dialog id="name-dialog"><form id="name-form"><header class="dialog-heading"><h2 id="name-title"></h2><button type="button" class="icon-button" data-close="name-dialog" aria-label="Close" data-i18n-aria-label="Close">×</button></header><input id="name-input" required maxlength="150" aria-label="Name" data-i18n-aria-label="Name"><footer class="dialog-actions"><button class="primary" data-i18n="Save">Save</button></footer></form></dialog>
</body></html>
